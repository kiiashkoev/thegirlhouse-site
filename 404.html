<!doctype html>
<html lang="pl">
<head>

<title>Nie znaleziono strony — The Girl House</title>

<style>
  :root { --neon:#FF6EC7; --grafit:#2B2A28; --krem:#F3ECE4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--krem); color:var(--grafit); text-align:center; padding:16px;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  img { width:100%; max-width:280px; height:auto; }
  h1 { font-size:1.1rem; letter-spacing:.18em; text-transform:uppercase; font-weight:500; margin-top:28px; }
  a { display:inline-block; margin-top:20px; color:var(--grafit); text-decoration:none;
      border-bottom:2px solid var(--neon); padding-bottom:2px; }
</style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="The Girl House" width="720" height="279">
