# The Girl House — www.thegirlhouse.com.pl
# Static site, no build step. Site files live in public/; repo root (CLAUDE.md, README.md…) is never published.

[build]
  publish = "public"
  command = ""

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Fonts never change under the same name: cache for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos and logos: a week.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS and JS are edited in place: always revalidate (Netlify ETag keeps it fast).
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Domain move: old domain → www.thegirlhouse.com.pl, permanent (301), path kept.
# Keep these rules FIRST among [[redirects]]: Netlify applies the first matching rule.
[[redirects]]
  from = "https://www.thegirlhouse-pruszcz.pl/*"
  to = "https://www.thegirlhouse.com.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://thegirlhouse-pruszcz.pl/*"
  to = "https://www.thegirlhouse.com.pl/:splat"
  status = 301
  force = true
